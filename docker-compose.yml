services:
  bot:
    build: .
    image: fishing-bot:latest
    container_name: fishing-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/fishing.db
    volumes:
      - ./data:/app/data
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
